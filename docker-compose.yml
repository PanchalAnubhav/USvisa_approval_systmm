version: "3.8"

services:
  usvisa-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: usvisa-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
    volumes:
      - ./final_model:/app/final_model
      - ./artifact:/app/artifact
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s