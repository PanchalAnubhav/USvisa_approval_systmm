version: "3.8"

services:

  usvisa-app:

    build:
      context: .
      dockerfile: DockerFile

    container_name: usvisa-app

    ports:
      - "8080:8080"

    env_file:
      - .env

    volumes:
      - ./artifact:/app/artifact
      - ./logs:/app/logs

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/health"
        ]

      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s