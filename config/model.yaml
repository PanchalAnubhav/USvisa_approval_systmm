grid_search:
  class: RandomizedSearchCV
  module: sklearn.model_selection
  params:
    cv: 3
    verbose: 2
    n_iter: 100
    n_jobs: 1

model_selection:
  module_0:
    class: XGBClassifier
    module: xgboost
    params:
      min_child_weight: 1
      max_depth: 9
      n_jobs: -1
    search_param_grid:
      max_depth:
        - 3
        - 5
        - 7
        - 9
      min_child_weight:
        - 1
        - 3
        - 5

  module_1:
    class: RandomForestClassifier
    module: sklearn.ensemble
    params:
      n_estimators: 200
      max_features: sqrt
      max_depth: null
    search_param_grid:
      max_depth:
        - 10
        - 12
        - 15
        - 20
        - null
      max_features:
        - sqrt
        - log2
        - null
      n_estimators:
        - 10
        - 50
        - 100
        - 200

  module_2:
    class: KNeighborsClassifier
    module: sklearn.neighbors
    params:
      weights: distance
      n_neighbors: 4
      algorithm: auto
    search_param_grid:
      algorithm:
        - auto
        - ball_tree
        - kd_tree
        - brute
      weights:
        - uniform
        - distance
      n_neighbors:
        - 3
        - 4
        - 5
        - 7
        - 9

  module_3:
    class: CatBoostClassifier
    module: catboost
    params:
      learning_rate: 0.1
      l2_leaf_reg: 3
      iterations: 300
      depth: 10
      verbose: false
    search_param_grid:
      depth:
        - 4
        - 6
        - 8
        - 10
      learning_rate:
        - 0.01
        - 0.03
        - 0.05
        - 0.1
      iterations:
        - 100
        - 200
        - 300
      l2_leaf_reg:
        - 1
        - 3
        - 5
        - 7
